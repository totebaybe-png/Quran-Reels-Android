name: 📱 Build Quran Reels Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'quran_reels_mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🔨 Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: quran_reels_mobile
        run: |
          flutter pub get

      - name: 🧹 Static Analysis (fail the build on any code issue)
        working-directory: quran_reels_mobile
        run: |
          flutter analyze --fatal-infos

      - name: 🧪 Run Automated Tests
        working-directory: quran_reels_mobile
        run: |
          flutter test

      - name: 🔑 Prepare Release Signing
        working-directory: quran_reels_mobile
        run: |
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            cat > android/key.properties <<'PROPS'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=quran-reels-release
          storeFile=release-keystore.jks
          PROPS
            cp -f android/release-keystore.jks android/app/release-keystore.jks 2>/dev/null || true
            echo "✅ Using the permanent release keystore for a signed, updatable APK"
          else
            echo "⚠️ KEYSTORE_PASSWORD secret is not set — building with the debug key (APK works but cannot be updated)"
          fi

      - name: 🚀 Build Release APK
        working-directory: quran_reels_mobile
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Reels-Android-APK
          path: quran_reels_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (if requested)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "📱 تطبيق ريلز القرآن للأندرويد v1.0.0 (بناء ${{ github.run_number }})"
          body: |
            ## 🌿 صدقة جارية لوجه الله تعالى
            **فكرة وتطوير:** مصطفى بحيري (قناة البحيري :behiry)
            
            ### 📥 التحميل والتثبيت:
            حمّل ملف `app-release.apk` المرفق وثبته على هاتفك الأندرويد مباشرة.
            
            - ⚡ أتمتة سحابية مجانية 24/7 دون استهلاك بطارية أو باقة
            - 🔒 تشفير محلي للأسرار بـ Libsodium SealedBox
            - 📺 فيديو الشرح التفصيلي: https://youtu.be/ozgBWYtWNLA
          files: quran_reels_mobile/build/app/outputs/flutter-apk/app-release.apk
